<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSeek Harness · 启动检查</title>
<style>
[hidden]{display:none!important}
:root{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;color:#20314b;background:#f3f6fb;font-size:14px}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:38px auto;padding:0 30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:700;font-size:13px;letter-spacing:.06em;color:#476ea8}h1{font-size:28px;margin:10px 0}p{color:#607086;line-height:1.7;margin:8px 0}.step{border:1px solid #ccd8e9;border-radius:20px;padding:8px 15px;background:white;color:#546d91;font-size:12px}.panel{background:white;border:1px solid #dbe3ef;border-radius:16px;padding:24px;box-shadow:0 8px 30px #28436a07}.statusline{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}#message{font-size:16px;font-weight:600}#count{color:#718199;font-size:13px}progress{width:100%;height:7px;border:0;border-radius:8px;overflow:hidden;accent-color:#476de8}progress::-webkit-progress-bar{background:#e9eef7}progress::-webkit-progress-value{background:#476de8}#base{font-size:12px;margin-top:13px;color:#65758d}table{width:100%;border-collapse:collapse;margin-top:20px}th{text-align:left;font-size:12px;font-weight:500;color:#718199;background:#f7f9fc;padding:12px}td{padding:17px 12px;border-bottom:1px solid #edf0f6;vertical-align:top}th:first-child,td:first-child{width:55px;text-align:center}th:nth-child(2){width:36%}input[type=checkbox]{width:18px;height:18px;accent-color:#4167e7;cursor:pointer}.name{font-weight:600;font-size:14px}.meta{font-size:12px;color:#7c899a;margin-top:5px;word-break:break-all}.badge{display:inline-block;font-size:12px;font-weight:600}.reason{font-size:12px;color:#718199;line-height:1.6;margin-top:6px;word-break:break-word;white-space:pre-wrap}.passed .badge{color:#22855d}.failed .badge,.failed .name{color:#c63f49}.failed{background:#fff8f8}.unknown .badge{color:#a77012}.checking .badge{color:#3e69cc}.pending .badge{color:#8896a9}#error{white-space:pre-wrap;font-size:13px;line-height:1.7;color:#ac3540;background:#fff1f2;border:1px solid #f0c8ce;padding:16px;border-radius:10px;margin-top:20px;overflow-wrap:anywhere}footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px}.buttons{display:flex;gap:10px;flex-shrink:0}button,a.button{border:1px solid #d1dbe9;border-radius:8px;padding:11px 20px;background:white;color:#385371;font:inherit;cursor:pointer;text-decoration:none}button.primary{background:#3e65dd;color:white;border-color:#3e65dd}button:disabled{opacity:.4;cursor:default}button:not(:disabled):hover{filter:brightness(.95)}.hint{font-size:12px;max-width:550px}details{font-size:12px;color:#6e7f96;margin-top:18px;line-height:1.8}summary{cursor:pointer}#open{color:#315edb;font-size:14px;display:inline-block;margin-top:14px}#empty{padding:32px;text-align:center;color:#7d8aa0}@media(max-width:700px){main{padding:0 16px;margin:20px auto}header{align-items:start}.step{display:none}.panel{padding:15px}footer{flex-direction:column;align-items:stretch}.buttons{justify-content:flex-end}th:nth-child(2){width:40%}}
</style></head><body><main>
<header><div><div class="brand">DEEPSEEK HARNESS</div><h1>选择本次加载的插件</h1><p>未变化的项目沿用上次结论，有变化的项目并行检查。取消勾选会保留安装和数据。</p></div><span class="step">01 检查与选择　→　02 启动</span></header>
<section class="panel"><div class="statusline"><span id="message" role="status">正在连接检查服务…</span><span id="count"></span></div><progress id="progress" max="1" value="0"></progress><div id="base"></div>
<table><thead><tr><th>加载</th><th>插件</th><th>本次检查结果</th></tr></thead><tbody id="items"></tbody></table><div id="empty">正在读取已安装插件…</div>
<div id="error" role="alert" hidden></div><a id="open" hidden rel="noreferrer">打开 DeepSeek Harness →</a>
<details><summary>检查范围</summary>比较 DSH、插件文件和配置：无变化时沿用上次结果，变化项最多 3 项并行检查。已验证的同一插件组合也会复用结果。需要主动排除临时故障时，可点击“强制重新检查”。检查覆盖独立加载及启动脚本，不代表插件全部功能已测试。</details>
</section><footer><p class="hint" id="hint">默认记住上次选择和检查结果。仅有变化时重新检查，红色项仍可由你决定是否加载。</p><div class="buttons"><button id="close">关闭</button><button id="scan" disabled>强制重新检查</button><button class="primary" id="launch" disabled>启动 DeepSeek Harness</button></div></footer>
</main><script>
const key=new URLSearchParams(location.search).get('key');
const $=id=>document.getElementById(id);let picks=new Map(), lastInventory='', lastPhase='',lastTable='',busy=false;
const labels={pending:'等待检查',checking:'检查中…',passed:'● 加载通过',failed:'● 加载失败',unknown:'● 未确定'};
const nick={};
async function request(route,body){const r=await fetch(route+'?key='+encodeURIComponent(key),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok)throw Error(data.error||'无法连接启动器');return data}
function render(s){
 const locked=!['ready','started'].includes(s.phase);$('message').textContent=s.message;$('count').textContent=s.total?`${s.complete} / ${s.total}`:'';$('progress').max=s.total||1;$('progress').value=s.complete;
 $('base').textContent=s.base?'基础环境：'+(s.base.status==='passed'?'加载通过':s.base.reason)+(s.base.cached?' · 沿用上次结论':''):'使用独立的数据目录并行检查';
 const signature=s.items.map(i=>i.id).join('|');if(signature!==lastInventory||(s.phase==='scanning'&&lastPhase!=='scanning')){picks=new Map(s.items.map(i=>[i.id,i.selected]));lastInventory=signature}
 const tableVersion=JSON.stringify([s.items,locked]);
 if(tableVersion!==lastTable){
 const focused=document.activeElement?.dataset?.id; $('items').replaceChildren();
 for(const i of s.items){if(!picks.has(i.id))picks.set(i.id,i.selected);const tr=document.createElement('tr');tr.className=i.status;const check=document.createElement('input');check.type='checkbox';check.checked=!!picks.get(i.id);check.disabled=locked;check.dataset.id=i.id;check.setAttribute('aria-label','加载 '+(nick[i.id]||i.name));check.onchange=()=>picks.set(i.id,check.checked);
 const td1=document.createElement('td');td1.append(check);const td2=document.createElement('td');const name=document.createElement('div');name.className='name';name.textContent=nick[i.id]||i.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=i.name+' · '+i.version;td2.append(name,meta);
 const td3=document.createElement('td');const badge=document.createElement('div');badge.className='badge';badge.textContent=(labels[i.status]||i.status)+(i.cached?' · 沿用上次':'');const reason=document.createElement('div');reason.className='reason';reason.textContent=i.reason;if(i.checkedAt)reason.textContent+='\n检查时间：'+new Date(i.checkedAt).toLocaleString();td3.append(badge,reason);tr.append(td1,td2,td3);$('items').append(tr);if(focused===i.id)check.focus({preventScroll:true})}
 lastTable=tableVersion;}
 $('empty').hidden=s.items.length>0;$('empty').textContent=locked?'正在读取已安装插件…':'没有可选的外部插件，可直接启动';
 $('launch').disabled=locked||busy;$('scan').disabled=['scanning','starting'].includes(s.phase)||busy;$('close').disabled=s.phase==='starting';$('launch').textContent=s.phase==='starting'?'正在启动…':'启动 DeepSeek Harness';
 $('error').hidden=!s.error;$('error').textContent=s.error||'';$('open').hidden=!s.url;if(s.url)$('open').href=s.url;
 if(s.phase==='started'&&lastPhase==='starting'&&s.url)location.assign(s.url);
 lastPhase=s.phase;
}
async function refresh(){try{render(await request('/state'))}catch(e){$('message').textContent='检查服务连接已断开';$('error').hidden=false;$('error').textContent=e.message+'。请重新打开桌面启动器。';$('launch').disabled=true;$('scan').disabled=true}}
async function action(route,body){busy=true;$('launch').disabled=true;$('scan').disabled=true;try{await request(route,body);if(route==='/scan'){picks.clear();lastInventory=''}await refresh()}catch(e){$('error').hidden=false;$('error').textContent=e.message}finally{busy=false}}
$('scan').onclick=()=>action('/scan',{force:true});$('launch').onclick=()=>action('/launch',{selected:[...picks].filter(([,v])=>v).map(([k])=>k)});$('close').onclick=async()=>{await request('/close',{}).catch(()=>{});window.close();$('message').textContent='启动器已关闭，可关闭此窗口';$('launch').disabled=true;$('scan').disabled=true};
setInterval(refresh,1500);refresh();
</script></body></html>
